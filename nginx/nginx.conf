# ==============================================================================
# TradeOS AI - Production High-Concurrency Nginx Reverse Proxy Configuration
# Optimized for 100,000+ Concurrent Traders, WebSocket Multiplexing, and DDoS Shield
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 200000; # Max open file descriptors for 100k+ sockets

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning & Zero-Copy File Transmission
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for Ultra-Fast UI Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Rate Limiting Zones (DDoS & Brute Force Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # Upstream Node.js Backend Cluster
    upstream tradeos_backend {
        least_conn; # Route to backend worker with fewest active connections
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 512;
    }

    # Upstream WebSocket Stream Cluster
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP to HTTPS Redirection (Port 80 -> 443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt SSL Challenge verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production Gateway (Port 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Configuration (Self-signed or Let's Encrypt Certificates)
        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        client_max_body_size 50M;

        # 1. Zero-Lag WebSocket Live Tick Stream Proxy (/ws/stream)
        location /ws/stream {
            proxy_pass http://tradeos_backend/ws/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering & extend timeouts for long-lived socket feeds
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Algorithmic Trading REST API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn addr_limit 100;

            proxy_pass http://tradeos_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # 3. Static Assets & Frontend UI SPA Fallback
        location / {
            proxy_pass http://tradeos_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
