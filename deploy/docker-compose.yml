version: '3.8'

# ==============================================================================
# TradeOS AI - Multi-Container Production Docker Compose Stack for AWS
# ==============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tradeos_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-tradeos-ai-institutional-master-key-32-byte-vault-2026}
      - JWT_SECRET=${JWT_SECRET:-tradeos-ai-jwt-super-secret-key-2026-institutional}
      - REDIS_URL=redis://redis:6379
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CASHFREE_SECRET_KEY=${CASHFREE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - redis
    networks:
      - tradeos_internal
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M

  redis:
    image: redis:7.2-alpine
    container_name: tradeos_redis
    restart: always
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 65535
    volumes:
      - redis_data:/data
    networks:
      - tradeos_internal

  nginx:
    image: nginx:1.25-alpine
    container_name: tradeos_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - tradeos_internal

networks:
  tradeos_internal:
    driver: bridge

volumes:
  redis_data:
